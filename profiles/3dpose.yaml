# 3DPose — 6x Basler a2A1920-165g5m GigE, 1920x1200, 100 fps
name: 3dpose
frame_width: 1920
frame_height: 1200
frame_rate: 100
calibration_frame_rate: 30   # calibration captures at this rate (no benefit to 100 fps for a slowly-waved board)
quality: 21
encode_parallel: 3           # concurrent NVENC jobs (raw mode) / .h264->mp4 remux jobs (realtime mode)
realtime_encode: true        # GPU H.264 encode during capture (no raw.bin, no post-hoc pass). Select "3dpose (raw)" to fall back.
realtime_kick: true          # default: real-time cross-camera frame kick-out — only frames every camera caught are encoded, so videos come out trigger-aligned with no post-hoc re-encode.
kick_max_lag: 240            # coordinator buffer (frames). DO NOT raise blindly: the NV12 ring scales with it; 1000 starved capture (24% loss, 2026-06-17). 240 runs clean.

pfs_path: "configs/mono8_1920x1200.pfs"
output_dir: "data"
board_config: "configs/boards/charuco_8x8_15mm.yaml"

serial_port: COM3
trigger_pins: [2, 4, 6, 8, 10, 12]

gige_driver: socket          # socket = user-space w/ reliable packet resends (proven). filter = in-kernel pylon GigE Vision driver: less CPU but silently dropped ~23% of frames w/ default resend settings (2026-06-12)

# Optostim pins forced LOW at boot (before the serial handshake) so a powered
# laser driver never sees a floating pin. Pin 53 = laser. Workflow pins are
# added automatically; this list is the floor.
stim_safe_pins: [53]
