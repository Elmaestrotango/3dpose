# 3DFace RAW fallback — identical rig to 3dface.yaml, but uses the proven
# raw-to-disk + post-hoc NVENC encode path (no real-time GPU encode). Select
# "3dface (raw)" in the dropdown if the real-time path misbehaves.
name: 3dface (raw)
frame_width: 1280
frame_height: 1024
frame_rate: 100
calibration_frame_rate: 30
quality: 21
encode_parallel: 3
realtime_encode: false
realtime_kick: false

pfs_path: "configs/mono8_mono.pfs"
output_dir: "data"
board_config: "configs/boards/charuco_5x5_3dface.yaml"

serial_port: COM3
trigger_pins: [2, 4, 6, 8, 10, 12]
