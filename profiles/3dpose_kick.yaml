# 3DPose KICK-OUT (experimental) - same rig as 3dpose.yaml, but uses the
# real-time frame kick-out path: frames not captured by every camera are dropped
# BEFORE encoding (via the cross-camera coordinator), so the per-camera videos
# come out already trigger-aligned and equal-length with NO post-hoc re-encode.
# Select "3dpose (kick)" to test it. Falls back to decoupled encode if NVENC
# init fails. The proven post-hoc path is still the default "3dpose" profile.
name: 3dpose (kick)
frame_width: 1920
frame_height: 1200
frame_rate: 100
calibration_frame_rate: 30
quality: 21
encode_parallel: 3
realtime_encode: true
realtime_kick: true          # <-- real-time cross-camera frame kick-out

pfs_path: "configs/mono8_1920x1200.pfs"
output_dir: "data"
board_config: "configs/boards/charuco_8x8_15mm.yaml"

serial_port: COM3
trigger_pins: [2, 4, 6, 8, 10, 12]
gige_driver: socket
